<section class="closing-section" id="contato" aria-labelledby="closing-title">
  <div class="closing-atmosphere" aria-hidden="true"></div>
  <div class="closing-content wrap">
    <div class="closing-mark" aria-hidden="true">
      <img
        src="/assets/images/askora-mark-black.webp"
        width="38"
        height="52"
        alt=""
      />
    </div>
    <h2 id="closing-title">O seu projeto começa<br />com uma conversa.</h2>
    <p>Conte sua ideia ou o que precisa funcionar melhor na sua empresa.</p>
    <a
      class="button button-dark closing-button"
      href="mailto:{{email}}"
      data-open-project
      aria-haspopup="dialog"
      aria-controls="project-dialog"
      >Conversar sobre um projeto {{icon:arrow-up}}</a
    >
    <noscript
      ><p class="no-script-contact">
        Escreva para <a href="mailto:{{email}}">{{email}}</a> ou
        <a href="{{whatsapp}}" target="_blank" rel="noopener noreferrer"
          >abra o WhatsApp</a
        >.
      </p></noscript
    >
  </div>
</section>
