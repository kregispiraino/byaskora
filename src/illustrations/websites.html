<div
  class="service-scene web-scene"
  data-scene="websites"
  role="group"
  aria-label="Prévia responsiva de sites de mobiliário, alimentação e serviços"
>
  <div class="web-workspace" data-device="desktop" data-palette="sage">
    <div class="web-browser">
      <div class="web-screen">
        <div class="web-chrome">
          <span class="web-window-dots" aria-hidden="true"
            ><i></i><i></i><i></i></span
          ><span class="web-address"
            ><svg class="icon" width="12" height="12">
              <use href="#i-shield"></use></svg
            ><span data-web-address>forma.studio</span></span
          >
          <div class="web-showcase-controls">
            <span data-web-position aria-hidden="true">01 / 03</span
            ><button
              type="button"
              data-web-pause
              aria-label="Pausar apresentação"
              aria-pressed="false"
              disabled
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <path
                  data-pause-icon
                  d="M5 3v10M11 3v10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
              </svg></button
            ><button
              type="button"
              data-web-next
              aria-label="Próximo site"
              disabled
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <path
                  d="m6 3 5 5-5 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="web-canvas"><!-- include:webShowcase --></div>
      </div>
    </div>
  </div>
  <p class="sr-only" role="status" data-web-announcement></p>
  <div
    class="web-device-controls"
    role="group"
    aria-label="Visualização responsiva"
  >
    <button
      type="button"
      data-device-button="desktop"
      aria-pressed="true"
      disabled
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.35"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="4" width="18" height="12" rx="2" />
        <path d="M12 16v4m-4 0h8" /></svg
      ><span>Desktop</span>
    </button>
    <button
      type="button"
      data-device-button="mobile"
      aria-pressed="false"
      disabled
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.35"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="6" y="2.5" width="12" height="19" rx="2.5" />
        <path d="M10 5h4m-3 14h2" /></svg
      ><span>Mobile</span>
    </button>
  </div>
</div>
