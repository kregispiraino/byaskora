<div class="entry-search" data-entry-search hidden>
  <div class="entry-search-box" data-entry-box>
    <span class="entry-search-address" aria-hidden="true">
      <span data-entry-domain>{{entryDomain}}</span
      ><span class="entry-search-path" data-entry-path></span
      ><span class="entry-search-caret"></span>
    </span>
    <button
      class="entry-search-button"
      type="button"
      data-entry-skip
      aria-label="Pular abertura e acessar a página"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="10.5"
          cy="10.5"
          r="6.5"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="m16 16 4.5 4.5"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
</div>
